    :root {
        /* UI Colors (Панели, кнопки, скроллы) */
        --nb-ui-bg: {{--uiBg--}};
        --nb-ui-fg: {{--uiFg--}};
        --nb-ui-panel: {{--uiPanel--}};
        --nb-ui-border: {{--uiBorder--}};
        --nb-ui-active: {{--uiActive--}}; /* Цвет выделения в списках/меню */

        /* Editor Colors (Основа) */
        --nb-edit-bg: {{--editBg--}};
        --nb-edit-fg: {{--editFg--}};
        --nb-edit-selection: {{--editSelection--}};

        /* Syntax Highlighting (Синтаксис) */
        --nb-syntax-keyword: {{--syntaxKeyword--}};
        --nb-syntax-string: {{--syntaxString--}};
        --nb-syntax-comment: {{--syntaxComment--}};
        --nb-syntax-number: {{--syntaxNumber--}};
        --nb-syntax-type: {{--syntaxType--}}; /* Классы, интерфейсы */

        /* Fonts & Sizes */
        --nb-ui-font-family: {{--uiFontFamily--}};
        --nb-ui-font-size: {{--uiFontSize--}}px;
        --nb-edit-font-family: {{--editFontFamily--}};
        --nb-edit-font-size: {{--editFontSize--}}px;
    }
</style>
